name: Update channel list

on:
  schedule:
    - cron: '17 6 * * *'   # every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build catalog from iptv-org
        run: python3 tools/build_catalog.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/channels.json
          git diff --cached --quiet || git commit -m "Update channel list"
          git push
