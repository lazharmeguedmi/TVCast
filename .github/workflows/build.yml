name: Build APK

on:
  push:
    paths-ignore:
      - 'catalog/**'
      - 'tools/**'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon 2>&1 | tee build.log; then
            # Surface compiler errors as annotations so they're visible without the full log
            grep -E "error:|\.java:[0-9]+|What went wrong|AAPT|Execution failed|> " build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TVCast.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVCast-apk
          path: TVCast.apk

      # Publishes the APK as a Release so you can download it straight from your phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Cast build ${{ github.run_number }}
          files: TVCast.apk
