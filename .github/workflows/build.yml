name: Build APK

on:
  push:
    paths-ignore:
      - 'catalog/**'
      - 'tools/**'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon 2>&1 | tee build.log; then
            # Surface compiler errors as annotations so they're visible without the full log
            msg=$(grep -v "> Task" build.log | grep -E -A3 "error:|What went wrong|AAPT|Execution failed" | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error::BUILD ERRORS%0A$msg"
            exit 1
          fi

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TVCast.apk
          cp tv/build/outputs/apk/debug/tv-debug.apk tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVCast-apks
          path: |
            TVCast.apk
            tv.apk

      # Publishes the APK as a Release so you can download it straight from your phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Cast build ${{ github.run_number }}
          make_latest: true
          body: |
            **Phone app:** TVCast.apk — install on your phone.
            **TV app:** tv.apk — on the TV, open Downloader and enter
            https://github.com/lazharmeguedmi/TVCast/releases/latest/download/tv.apk
          files: |
            TVCast.apk
            tv.apk
