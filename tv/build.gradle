plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvcast.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tvcast.tv'
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }

    signingConfigs {
        tvcast {
            storeFile file('../app/tvcast.keystore')
            storePassword 'tvcast123'
            keyAlias 'tvcast'
            keyPassword 'tvcast123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tvcast
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.tvcast
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
