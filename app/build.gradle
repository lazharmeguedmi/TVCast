plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvcast.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tvcast.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }

    // Fixed key so each new build installs as an update over the previous one.
    signingConfigs {
        tvcast {
            storeFile file('tvcast.keystore')
            storePassword 'tvcast123'
            keyAlias 'tvcast'
            keyPassword 'tvcast123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tvcast
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.tvcast
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
